<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>양현준의 앱</title>
<style>
:root{--bg:#FFFCF7;--fg:#1F1B16;--muted:#5E5446;--line:#E6DDD0;--accent:#7A5C3E;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1714;--fg:#f3ece2;--muted:#b9ad9c;--line:#3a332b;--accent:#d9b38c;--card:#23201b}}
:root[data-theme="dark"]{--bg:#1a1714;--fg:#f3ece2;--muted:#b9ad9c;--line:#3a332b;--accent:#d9b38c;--card:#23201b}
body{background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;margin:0;padding:48px 16px}
main{max-width:640px;margin:auto}
h1{font-size:24px;margin:0 0 24px}
a.app{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;color:inherit;text-decoration:none}
a.app strong{font-size:19px}.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>앱</h1>
  <a class="app" href="geukjeok/"><strong>긁적</strong><br><span class="muted">카드 결제 문자를 읽어 자동으로 쓰는 가계부</span></a>
</main>
</body>
</html>

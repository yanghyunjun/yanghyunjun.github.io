<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>긁적</title>
<meta name="description" content="카드 결제 문자를 읽어 자동으로 쓰는 가계부. 같이 쓰는 사람과 초대코드로 함께 봐요.">
<style>
:root{--bg:#FFFCF7;--fg:#1F1B16;--muted:#5E5446;--line:#E6DDD0;--accent:#7A5C3E;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1714;--fg:#f3ece2;--muted:#b9ad9c;--line:#3a332b;--accent:#d9b38c;--card:#23201b}}
:root[data-theme="dark"]{--bg:#1a1714;--fg:#f3ece2;--muted:#b9ad9c;--line:#3a332b;--accent:#d9b38c;--card:#23201b}
body{background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;margin:0;padding:48px 16px 64px}
main{max-width:640px;margin:auto}
h1{font-size:40px;margin:0;color:var(--accent)}
.lead{font-size:19px;margin:4px 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 20px;margin:16px 0}
h2{font-size:17px;margin:16px 0 4px}p,li{margin:6px 0}.muted{color:var(--muted)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>긁적</h1>
  <p class="lead">긁은 하루를 차곡차곡 적어요.</p>

  <div class="card">
    <h2>자동 기록</h2>
    <p>카드 결제 문자가 오면 가맹점, 금액, 시간을 읽어 가계부에 바로 적어요. 가맹점마다 카테고리를 한 번 정해 두면 다음부터 알아서 분류해요.</p>
    <h2>함께 쓰기</h2>
    <p>배우자처럼 같이 돈을 쓰는 사람을 초대코드로 초대하면, 두 사람의 결제를 한 가계부에서 함께 봐요.</p>
  </div>

  <div class="card">
    <h2>문의</h2>
    <p>이메일: <a href="mailto:[문의 이메일]">[문의 이메일]</a></p>
    <p class="muted">계정 삭제나 개인정보 열람을 요청할 때는 앱의 메뉴 → 내 계정 · 개인정보에 있는 계정 ID를 함께 알려 주세요.</p>
    <h2>약관 · 정책</h2>
    <p><a href="privacy.html">개인정보처리방침</a></p>
  </div>
</main>
</body>
</html>
